# Active project: the self-managed Supabase project. Its schema and data were
# created outside this CLI, so `supabase_migrations.schema_migrations` does not
# know about the 71 files in ./migrations.
#
# DO NOT run `supabase db push`, `supabase db reset`, or `supabase migration
# repair` against this project. Push would try to replay every migration
# against an already-populated database. `functions deploy` and `gen types`
# are safe -- neither touches data.
project_id = "gmdbrgjxdeztgzvqsaaj"

[functions.hikvision-attendance]
verify_jwt = false

[functions.ingest-attendance]
verify_jwt = false

[functions.hik-attendance]
verify_jwt = false

# Called by cron on the VPS, which has no user session to present. The
# x-backup-secret header is what authorises it — see the function's header
# comment and docs/BACKUP_AND_RESTORE.md §6.
[functions.backup-report]
verify_jwt = false
